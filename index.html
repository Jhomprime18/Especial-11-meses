<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 11 Meses Mi Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4081;
            --secondary: #c2185b;
            --bg-gradient: linear-gradient(-45deg, #fce4ec, #f8bbd0, #f48fb1, #ffc1e3);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 1000px;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--secondary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Estilo del Botón Mejorado */
        #music-btn {
            background: linear-gradient(45deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(245, 0, 87, 0.3);
            margin: 30px 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #music-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(245, 0, 87, 0.5);
        }

        /* Galería con Diseño Gráfico */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .photo-frame {
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .photo-frame:hover {
            transform: translateY(-15px) rotate(3deg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .photo-frame img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Mensaje con Glassmorphism */
        #message-box {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 32px rgba(194, 24, 91, 0.15);
            margin-top: 40px;
        }

        #message {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #5c001e;
            font-weight: 500;
            margin: 0;
        }

        /* Corazones Animados */
        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: moveUp 5s linear infinite;
        }

        @keyframes moveUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="love-song" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>11 Meses a tu lado</h1>
        
        <button id="music-btn" onclick="playMusic()">❤️ Te dedico esta canción mi gordita preciosa</button>

        <div class="gallery">
            <div class="photo-frame"><img src="WhatsApp Image 2026-05-02 at 2.33.27 PM.jpeg"></div>
            <div class="photo-frame"><img src="image_8a251e.jpg"></div>
            <div class="photo-frame"><img src="image_8a2578.jpg"></div>
            <div class="photo-frame"><img src="image_8a28bd.jpg"></div>
            <div class="photo-frame"><img src="image_8a28fa.jpg"></div>
            <div class="photo-frame"><img src="image_8a291a.jpg"></div>
            <div class="photo-frame"><img src="image_8a293b.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c00.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c3e.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c5d.jpg"></div>
        </div>

        <div id="message-box">
            <p id="message"></p>
        </div>
    </div>

    <script>
        function playMusic() {
            const audio = document.getElementById('love-song');
            audio.play().catch(e => console.log("Audio play error"));
            document.getElementById('music-btn').innerHTML = "🎶 Con mucho amor para ti...";
        }

        const text = "Felices 11 meses, mi niña hermosa. Gracias por aparecer en mi vida y por cada momento que hemos compartido, a pesar de la distancia. Eres la persona más especial que tengo y estoy muy orgulloso de ti. Por como afrontas todo, por el tiempo que me dedicas, por como me amas. Quiero muchos meses mas contigo incluso años gracias por tanto mi amor sin mas disfruta de la cancion que te dedique :3 ";
        
        let index = 0;
        function typeText() {
            if (index < text.length) {
                document.getElementById('message').innerHTML += text.charAt(index);
                index++;
                setTimeout(typeText, 30); // Velocidad rápida (30ms)
            }
        }
        
        window.onload = typeText;

        // Generador de lluvia de corazones variados
        function createHeart() {
            const symbols = ['❤️', '💖', '💕', '✨', '🌸'];
            const h = document.createElement('div');
            h.classList.add('heart');
            h.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 30 + 15 + 'px';
            h.style.animationDuration = (Math.random() * 3 + 4) + 's';
            h.style.filter = `hue-rotate(${Math.random() * 50}deg)`;
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }

        setInterval(createHeart, 250); // Más corazones y más frecuentes
    </script>
</body>
</html>
