<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 Meses de Puro Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bright: #ff0077;
            --pink-dark: #4a001f;
            --glass: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #880e4f 0%, #2a0011 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Lluvia de partículas en el fondo */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 50px 20px;
            max-width: 1100px;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: #ff80ab;
            text-shadow: 0 0 20px rgba(255, 128, 171, 0.6);
            margin-bottom: 10px;
            animation: pulseTitle 2s ease-in-out infinite;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 128, 171, 0.6); }
            50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(255, 128, 171, 0.9); }
        }

        #music-btn {
            background: linear-gradient(45deg, #ff0077, #ff5c8d);
            color: white;
            border: none;
            padding: 20px 45px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(255, 0, 119, 0.5);
            margin-bottom: 50px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #music-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 119, 0.8);
        }

        /* Galería Estilo "Collage Tirado" */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 50px 0;
        }

        .photo-frame {
            background: white;
            padding: 12px 12px 40px 12px;
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: 0.4s;
            width: 220px;
        }

        /* Rotaciones aleatorias para estilo gráfico */
        .photo-frame:nth-child(odd) { transform: rotate(-3deg); }
        .photo-frame:nth-child(even) { transform: rotate(3deg); }

        .photo-frame:hover {
            transform: scale(1.2) rotate(0deg);
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .photo-frame img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Caja de Mensaje Estilo Neon */
        #message-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ff0077;
            padding: 40px;
            border-radius: 30px;
            box-shadow: inset 0 0 20px rgba(255, 0, 119, 0.3), 0 0 20px rgba(255, 0, 119, 0.2);
            margin-top: 60px;
            position: relative;
        }

        #message {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #ffe4ee;
            font-weight: 400;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Animación de Corazones */
        .heart-particle {
            position: absolute;
            color: #ff4081;
            font-size: 20px;
            pointer-events: none;
            animation: fly 6s linear infinite;
            opacity: 0;
        }

        @keyframes fly {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <audio id="love-song" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>11 Meses Contigo y vamos por muchas mas Mami</h1>
        
        <button id="music-btn" onclick="playMusic()">❤️ Te dedico esta canción mi gordita preciosa</button>

        <div class="gallery">
            <div class="photo-frame"><img src="WhatsApp Image 2026-05-02 at 2.33.27 PM.jpeg"></div>
            <div class="photo-frame"><img src="image_8a251e.jpg"></div>
            <div class="photo-frame"><img src="image_8a2578.jpg"></div>
            <div class="photo-frame"><img src="image_8a28bd.jpg"></div>
            <div class="photo-frame"><img src="image_8a28fa.jpg"></div>
            <div class="photo-frame"><img src="image_8a291a.jpg"></div>
            <div class="photo-frame"><img src="image_8a293b.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c00.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c3e.jpg"></div>
            <div class="photo-frame"><img src="image_8a2c5d.jpg"></div>
        </div>

        <div id="message-box">
            <p id="message"></p>
        </div>
    </div>

    <script>
        function playMusic() {
            const audio = document.getElementById('love-song');
            audio.play().catch(e => console.log("Audio play error"));
            document.getElementById('music-btn').innerHTML = "💖 Nuestra canción sonando...";
        }

        const text = "Felices 11 meses, mi niña hermosa. Gracias por aparecer en mi vida y por cada momento que hemos compartido, a pesar de la distancia. Eres la persona más especial que tengo y estoy muy orgulloso de ti. Por como afrontas todo, por el tiempo que me dedicas, por como me amas a pesar de que haga mis errores pero siempre cambio para ser un mejor novio y un mejor futuro esposo. Quiero muchos meses mas contigo incluso años gracias por tanto mi amor mi mejor decision en mi vida ha sido amarte y protegerte siempre estare contigo en las buenas y en las malas sin mas disfruta de la cancion que te dedique mi amor:3 ";
        
        let index = 0;
        function typeText() {
            if (index < text.length) {
                document.getElementById('message').innerHTML += text.charAt(index);
                index++;
                setTimeout(typeText, 30); // Velocidad rápida
            }
        }
        
        window.onload = () => {
            typeText();
            startHearts();
        };

        function startHearts() {
            const container = document.getElementById('particles');
            const symbols = ['❤️', '💖', '💕', '🔥', '✨'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-particle');
                heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.opacity = Math.random();
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 6000);
            }, 300);
        }
    </script>
</body>
</html>
