<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 11 Meses Mi Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fce4ec;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #c2185b;
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
            padding: 10px;
        }

        .photo-frame {
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            border-radius: 2px;
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(2deg);
            z-index: 10;
        }

        .photo-frame img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        #music-btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #message {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #444;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            min-height: 100px;
        }

        .heart {
            position: absolute;
            color: #f06292;
            pointer-events: none;
            animation: moveUp 4s linear infinite;
        }

        @keyframes moveUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="love-song" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>11 Meses a tu lado y vamos por muchas mas</h1>
        
        <button id="music-btn" onclick="playMusic()">❤️ Te dedico esta cancion mi gordita preciosa</button>

        <div class="gallery">
            <div class="photo-frame"><img src="WhatsApp Image 2026-05-02 at 2.33.27 PM.jpeg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a251e.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a2578.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a28bd.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a28fa.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a291a.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a293b.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a2c00.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a2c3e.jpg" alt="Amor"></div>
            <div class="photo-frame"><img src="image_8a2c5d.jpg" alt="Amor"></div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function playMusic() {
            const audio = document.getElementById('love-song');
            audio.play().catch(e => console.log("Error de reproducción:", e));
            document.getElementById('music-btn').innerHTML = "🎶 Sonando para ti...";
        }

        const text = "Felices 11 meses, mi niña hermosa. Gracias por aparecer en mi vida y por cada momento que hemos compartido, a pesar de la distancia. Eres la persona más especial que tengo y estoy muy orgulloso de ti. Por como afrontas todo, por el tiempo que me dedicas, por como me amas. Quiero muchos meses mas contigo incluso años gracias por tanto mi amor sin mas disfruta de la cancion que te dedique :3 ";
        
        let index = 0;
        function typeText() {
            if (index < text.length) {
                document.getElementById('message').innerHTML += text.charAt(index);
                index++;
                // AQUÍ SE CAMBIÓ DE 60 A 30 PARA MÁS VELOCIDAD
                setTimeout(typeText, 30);
            }
        }
        
        window.onload = typeText;

        setInterval(() => {
            const h = document.createElement('div');
            h.classList.add('heart');
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 20 + 10 + 'px';
            h.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }, 400);
    </script>
</body>
</html>
